name: Proves

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, dom, sodium
          coverage: none

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: launcher/xarxa/go.sum
      - name: Proves del servidor HTTPS
        run: |
          go -C launcher/xarxa test ./...
          mkdir -p dist
          go -C launcher/xarxa build -trimpath -o ../../dist/compas-xarxa .
          python3 tests/https.py dist/compas-xarxa

      - name: Prova l'arrancador Linux en mode HTTPS
        run: |
          d="$RUNNER_TEMP/programa-https"
          mkdir -p "$d"
          cp -a app src "$d/"
          cp launcher/linux/compas.sh dist/compas-xarxa "$d/"
          printf 'lan=1\nnom_lan=compas-prova.local\nport=18740\nport_https=18443\n' > "$d/compas.ini"
          export COMPAS_DADES="$RUNNER_TEMP/dades-https" COMPAS_NAVEGADOR=0 XDG_CONFIG_HOME="$RUNNER_TEMP/config-prova"
          bash "$d/compas.sh" > "$RUNNER_TEMP/llancador-https.log" 2>&1 &
          servidor=$!
          trap 'kill -TERM "$servidor" 2>/dev/null || true; wait "$servidor" || true' EXIT
          for i in $(seq 1 30); do
            if curl --noproxy '*' --cacert "$COMPAS_DADES/https/compas-ca.crt" --resolve compas-prova.local:18443:127.0.0.1 -fsS https://compas-prova.local:18443/ > "$RUNNER_TEMP/https.html"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/llancador-https.log"
          grep -q 'Configuració inicial' "$RUNNER_TEMP/https.html"
          test "$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18740/)" = 403

      - name: Revisa la sintaxi PHP
        run: find app src eines tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Executa les proves automatitzades
        run: php tests/run.php

      - name: Proves d'integració (Compàs de veres, en valencià i castellà)
        run: python3 tests/integracio.py

      - name: Prova d'arrancada
        run: |
          export COMPAS_DADES=$RUNNER_TEMP/dades
          php -S 127.0.0.1:8740 -t app app/index.php > servidor.log 2>&1 &
          SERVIDOR=$!
          trap 'kill $SERVIDOR 2>/dev/null || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8740/ | grep -q "Configuració inicial"
          curl -fsS -o /dev/null http://127.0.0.1:8740/assets/estil.css
