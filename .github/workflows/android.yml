# Compàs per a Android: PHP estàtic (provat amb les proves de Compàs i amb les crides al sistema que Android permet) i APK.
# No es prova en un emulador: els emuladors per a ordinador són x86_64 i el PHP musl només és vàlid a Android en arm64.
# Es llança amb cada canvi a android/ o a este fitxer, i a mà. L'APK que es publica el fa publica.yml.
name: Android

on:
  push:
    branches: ['main', 'android']
    paths: ['android/**', '.github/workflows/android.yml', 'src/android.php', 'src/xarxa.php']
  workflow_dispatch:
  workflow_call:
    inputs:
      versio:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

env:
  PHP_VERSIO: '8.3'
  # Les mateixes extensions que la versió de Windows, i les que PHP necessita per a elles
  PHP_EXT: 'ctype,dom,fileinfo,filter,iconv,mbstring,opcache,pdo,pdo_sqlite,session,simplexml,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zlib'

jobs:
  php:
    name: PHP estàtic (${{ matrix.arq }})
    strategy:
      matrix:
        include:
          - arq: aarch64
            runner: ubuntu-24.04-arm
          - arq: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Clau de la memòria cau (versió i extensions)
        id: clau
        run: echo "clau=php-android-v3-${{ matrix.arq }}-$PHP_VERSIO-$(echo "$PHP_EXT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Memòria cau del PHP compilat
        id: cau
        uses: actions/cache@v4
        with:
          path: php-${{ matrix.arq }}
          key: ${{ steps.clau.outputs.clau }}
      - name: Compila PHP (musl, estàtic)
        if: steps.cau.outputs.cache-hit != 'true'
        run: |
          mkdir -p spc && cd spc
          for i in 1 2 3; do curl -fsSL -o spc "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-linux-${{ matrix.arq }}" && break; sleep 20; done
          chmod +x spc
          ./spc --version
          ./spc doctor --auto-fix
          ./spc download --with-php=$PHP_VERSIO --for-extensions="$PHP_EXT" --retry=3
          # Android (bionic) només deixa fer accept4, no accept: el servidor de PHP moriria en la primera connexió.
          # Amb un indicador (SOCK_CLOEXEC), perquè musl fa accept si no n'hi ha cap.
          ./spc extract php-src
          f=source/php-src/main/network.c
          grep -c 'accept(srvsock' "$f"
          sed -i 's/= accept(srvsock, \(.*\));/= accept4(srvsock, \1, SOCK_CLOEXEC);/' "$f"
          grep -n 'accept4(srvsock' "$f"
          ! grep -n '[^4]accept(srvsock' "$f"
          ./spc build "$PHP_EXT" --build-cli
          cp buildroot/bin/php ../php-${{ matrix.arq }}
      - name: Comprova el PHP
        run: |
          file php-${{ matrix.arq }}
          ls -la php-${{ matrix.arq }}
          ./php-${{ matrix.arq }} -v
          ./php-${{ matrix.arq }} -m | tee moduls.txt
          for m in pdo_sqlite sqlite3 mbstring sodium SimpleXML dom zlib iconv fileinfo session ctype 'Zend OPcache'; do
            grep -qx "$m" moduls.txt || { echo "Falta $m"; exit 1; }
          done
      - name: Proves de Compàs amb este PHP
        if: matrix.arq == 'x86_64'
        run: |
          mkdir -p bin && cp php-x86_64 bin/php
          PATH="$PWD/bin:$PATH" python3 tests/integracio.py ca
      # Android talla les crides al sistema que no fa servir bionic (seccomp). Les proves de Compàs passen
      # amb el PHP d'arm64 dins de strace i es comprova que totes les crides que fa estan permeses.
      - name: Crides al sistema permeses a Android (arm64)
        if: matrix.arq == 'aarch64'
        run: |
          sudo apt-get install -y -qq strace > /dev/null
          mkdir -p bin st
          printf '#!/bin/sh\nexec strace -f -qq -o "%s/st/$$.txt" "%s/php-aarch64" "$@"\n' "$PWD" "$PWD" > bin/php
          chmod +x bin/php
          PATH="$PWD/bin:$PATH" timeout 300 python3 -u tests/integracio.py economia android ca || true
          ls -la st | head
          python3 android/comprova-seccomp.py st/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.arq }}
          path: php-${{ matrix.arq }}
          retention-days: 7

  apk:
    name: APK
    needs: php
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: php-*
          path: phps
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepara el programa i el PHP
        run: |
          android/prepara.sh phps
          # Només arm64, com els mòbils (el PHP musl per a x86_64 fa crides al sistema antigues que Android no deixa fer)
          rm -rf android/app/src/main/jniLibs/x86_64
      - name: Compila (prova)
        run: gradle -p android assembleDebug --stacktrace
      - name: Compila (per a publicar, només arm64)
        env:
          COMPAS_VERSIO: ${{ inputs.versio }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/compas.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/compas.jks"
          else
            echo "::warning::Sense ANDROID_KEYSTORE_B64: l'APK per a publicar no es pot signar"
          fi
          gradle -p android assembleRelease --stacktrace
          ls -la android/app/build/outputs/apk/*/
          # Per a publicar: només si està signat
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$COMPAS_VERSIO" ]; then
            mkdir -p paquet
            cp android/app/build/outputs/apk/release/app-release.apk "paquet/Compas-${COMPAS_VERSIO#v}-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/*/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: hashFiles('paquet/*.apk') != ''
        with:
          name: paquet-android
          path: paquet/*.apk
          retention-days: 7
