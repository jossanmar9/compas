name: "🐞 He trobat una errada / He encontrado un error"
description: "Alguna cosa no funciona com hauria. / Algo no funciona como debería."
title: "[Errada] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gràcies per avisar! No cal saber d'informàtica: explica-ho amb les teues paraules, com ho contaries a un company.
        *¡Gracias por avisar! No hace falta saber de informática: explícalo con tus palabras. Puedes escribir en castellano.*

        ⚠️ **No poses dades reals de persones** (noms, DNI, telèfons…) ni en el text ni en les captures. Tapa-les o fes la captura amb les dades d'exemple.
        *No pongas datos reales de personas, ni en el texto ni en las capturas.*
        **Seguretat:** si pot exposar dades o saltar-se permisos, [comunica-ho en privat](https://github.com/jossanmar9/compas/blob/main/SECURITY.md), no en esta issue.
        *Si puede exponer datos o saltarse permisos, comunícalo en privado.*
        No adjuntes bases de dades, còpies, IBAN, contrasenyes ni codis de recuperació.
  - type: input
    id: versio
    attributes:
      label: "Quina versió de Compàs tens? / ¿Qué versión tienes?"
      description: "La pots consultar a Ajuda. / Puedes consultarla en Ayuda."
      placeholder: "Per exemple: 2.0.2"
  - type: textarea
    id: feia
    attributes:
      label: "Què estaves fent? / ¿Qué estabas haciendo?"
      description: "Els passos, en ordre, fins que ha passat l'errada."
      placeholder: |
        1. He anat a Persones i he premut «+ Nou»
        2. He omplit el nom i la data de naixement
        3. He premut «Desa»
    validations:
      required: true
  - type: textarea
    id: passat
    attributes:
      label: "Què ha passat? / ¿Qué ha pasado?"
      description: "Si ha eixit un missatge d'error, copia'l tal qual."
      placeholder: "Ha eixit el missatge «…» i no s'ha guardat la persona."
    validations:
      required: true
  - type: textarea
    id: esperava
    attributes:
      label: "Què esperaves que passara? / ¿Qué esperabas que pasara?"
      placeholder: "Que es guardara la persona i s'obrira la seua fitxa."
  - type: textarea
    id: captures
    attributes:
      label: "Captures de pantalla / Capturas de pantalla"
      description: "Opcional. Pots arrossegar les imatges ací. Recorda tapar les dades personals."
  - type: dropdown
    id: sistema
    attributes:
      label: "Sistema operatiu / Sistema operativo"
      options:
        - "Windows 11"
        - "Windows 10"
        - "Linux (indica la distribució i versió més avall / indica distribución y versión abajo)"
        - "Altre / Otro"
        - "No ho sé / No lo sé"
  - type: dropdown
    id: paquet
    attributes:
      label: "Com l'has instal·lat? / ¿Cómo lo has instalado?"
      options:
        - "Instal·lador Windows / Instalador Windows"
        - "Portable Windows (.zip)"
        - "Linux (.deb)"
        - "Linux (.tar.gz)"
        - "Codi font / Código fuente"
        - "No ho sé / No lo sé"
  - type: input
    id: entitat
    attributes:
      label: "Tipus d'entitat / Tipo de entidad"
      placeholder: "Club esportiu, societat musical, AMPA, falla…"
      description: "Només el tipus, no el nom real de l'entitat. / Solo el tipo, no el nombre real."
  - type: textarea
    id: entorn
    attributes:
      label: "Altres detalls / Otros detalles"
      description: "Distribució i versió de Linux, navegador o visor, mòduls actius, si passa amb dades d'exemple… / Distribución y versión de Linux, navegador o visor, módulos activos, si ocurre con datos de ejemplo…"
  - type: checkboxes
    id: dades
    attributes:
      label: "Dades personals / Datos personales"
      options:
        - label: "He comprovat que no hi ha dades reals de persones en el que envie. / He comprobado que no hay datos reales de personas."
          required: true
