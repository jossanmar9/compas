; Configuració del llançador de Compàs
; Després de canviar-la, tanca i torna a obrir Compàs.

; Port on s'obri Compàs (http://localhost:PORT)
port = 8740

; 0 = només es pot utilitzar des d'aquest ordinador (recomanat)
; 1 = també des d'altres equips de la mateixa xarxa (Windows demanarà permís al tallafoc)
xarxa = 0

; 1 = obri el navegador automàticament en arrancar
navegador = 1
