; Configuració del llançador de Compàs
; Després de canviar-la, tanca i torna a obrir Compàs.

; Port intern de PHP i del mode local. En xarxa es publica per HTTPS en el port separat.
port = 8740

; 1 = obri el navegador automàticament en arrancar
navegador = 1

; 1 = obri Compàs en la seua finestra, sense navegador (amb el component WebView2 de Windows).
;     En tancar-la, es fa la còpia de seguretat i Compàs s'atura.
; 0 = obri el navegador habitual i mostra la finestra menuda de Compàs, com abans.
finestra = 1


; Xarxa local segura: es pot activar des de l’assistent del servidor.
; Windows: botó «Xarxa local / HTTPS…». Linux: compas --xarxa.
; El servidor ha de quedar encés. Els altres equips obrin la mateixa URL.
; No cal IP fixa ni configurar el router. Només en una xarxa privada.
lan = 0
; Nom .local únic a la vostra xarxa. Descobriment automàtic amb mDNS.
nom_lan = compas.local
; Port HTTPS (443 permet escriure només https://compas.local).
port_https = 443
