; Configuració del llançador de Compàs
; Després de canviar-la, tanca i torna a obrir Compàs.

; Port on s'obri Compàs (http://localhost:PORT). Canvia'l només si un altre programa ja l'utilitza.
port = 8740

; 1 = obri el navegador automàticament en arrancar
navegador = 1

; 1 = obri Compàs en la seua finestra, sense navegador (amb el component WebView2 de Windows).
;     En tancar-la, es fa la còpia de seguretat i Compàs s'atura.
; 0 = obri el navegador habitual i mostra la finestra menuda de Compàs, com abans.
finestra = 1


; Mode LAN opcional: només al servidor, en una xarxa privada de confiança.
; 0 = només este ordinador (per defecte). 1 = permet altres ordinadors de la LAN.
; En mode LAN, el panell del servidor ha de quedar obert; tancar el navegador no l’atura.
lan = 0
; IPv4 privada fixa d’ESTE ordinador servidor (no la del client). Exemple: 192.168.1.20
adreca_lan =
